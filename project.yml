# Projektbeschreibung für XcodeGen – daraus wird beim Bauen das Xcode-Projekt erzeugt.
name: Logbuch
options:
  bundleIdPrefix: de.logbuch
  deploymentTarget:
    iOS: "16.0"
targets:
  Logbuch:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
      - path: Web
        type: folder
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Logbuch
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.logbuch.onepiece
        PRODUCT_NAME: Logbuch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
