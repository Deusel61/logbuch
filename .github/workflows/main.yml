name: IPA bauen

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Dateien in Ordner sortieren
        run: |
          mkdir -p Sources Web Resources/Assets.xcassets/AppIcon.appiconset
          if [ -f LogbuchApp.swift ]; then mv LogbuchApp.swift Sources/; fi
          if [ -f index.html ]; then mv index.html Web/; fi
          if [ -f icon-1024.png ]; then mv icon-1024.png Resources/Assets.xcassets/AppIcon.appiconset/; fi
          printf '%s\n' '{ "info" : { "author" : "xcode", "version" : 1 } }' > Resources/Assets.xcassets/Contents.json
          printf '%s\n' '{ "images" : [ { "filename" : "icon-1024.png", "idiom" : "universal", "platform" : "ios", "size" : "1024x1024" } ], "info" : { "author" : "xcode", "version" : 1 } }' > Resources/Assets.xcassets/AppIcon.appiconset/Contents.json
          ls -R Sources Web Resources

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Xcode-Projekt erzeugen
        run: xcodegen generate

      - name: App bauen (ohne Signatur)
        run: |
          xcodebuild \
            -project Logbuch.xcodeproj \
            -scheme Logbuch \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: IPA packen
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Logbuch.app Payload/
          zip -qry Logbuch.ipa Payload
          ls -lh Logbuch.ipa

      - name: IPA bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Logbuch-IPA
          path: Logbuch.ipa
          retention-days: 30
